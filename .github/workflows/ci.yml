name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: piu
          POSTGRES_PASSWORD: piu
          POSTGRES_DB: piu_mail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: piu_mail_test
      DB_USERNAME: piu
      DB_PASSWORD: piu

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, intl, redis
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: npm install + build (typecheck included)
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Migrate (real PostGIS)
        run: php artisan migrate --force

      - name: PostGIS check
        run: php artisan piu:check-postgis

      - name: Pest
        run: vendor/bin/pest
